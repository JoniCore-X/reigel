services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REIGEL_ENV: production
      REIGEL_DB_PATH: /app/data/reigel.db
      SITE_URL: https://${DOMAIN:?Configura DOMAIN en .env}
    volumes:
      - solar_data:/app/data
    expose:
      - "8765"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configura DOMAIN en .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?Configura CADDY_EMAIL en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  solar_data:
  caddy_data:
  caddy_config:
